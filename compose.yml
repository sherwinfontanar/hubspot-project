
services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      PORT: "3000"
      DATABASE_PATH: /app/data/orders.db
    volumes:
      - order-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  order-data:

    
